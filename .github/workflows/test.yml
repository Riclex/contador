name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check index.js
          node --check lib/commands.js
          node --check lib/security.js
          node --check lib/parsers.js
          node --check lib/cache.js
          node --check lib/openai.js
          node --check lib/session.js

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        # Serialize test files: each starts a MongoMemoryReplSet, and parallel
        # files race on port allocation ("Port already in use").
        run: node --test --test-concurrency=1 test/integration/*.test.js

      - name: Run all tests
        run: npm run test:all